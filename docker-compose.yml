services:
  app:
    image: iracing-race-radar:local
    container_name: iracing-race-radar
    build: .
    ports:
      - "${PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      TZ: "${TZ:-Europe/Prague}"
    volumes:
      - "${DATA_DIR:-./.data}:/app/.data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
